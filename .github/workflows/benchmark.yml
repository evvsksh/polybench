name: Benchmark

on:
  push:

jobs:
  benchmark:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    name: Benchmark (${{ matrix.language }})

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            install: pip install psutil
            setup: actions/setup-python@v5
            version_key: python-version
            version: "3.11"
            run_dir: benchmarks/python
            run_cmd: python3 main.py
            artifact: benchmark-python

          - language: javascript
            install: ""
            setup: actions/setup-node@v4
            version_key: node-version
            version: "20"
            run_dir: benchmarks/javascript
            run_cmd: node main.js
            artifact: benchmark-javascript

    steps:
      - uses: actions/checkout@v4

      - name: ${{ matrix.language }} setup
        uses: ${{ matrix.setup }}
        with:
          ${{ matrix.version_key }}: ${{ matrix.version }}

      - name: install
        if: matrix.install != ''
        run: ${{ matrix.install }}

      - name: run benchmark
        run: |
          cd ${{ matrix.run_dir }}
          ${{ matrix.run_cmd }} > result.json

      - name: build result
        run: |
          mkdir -p results
          jq -n --slurpfile data ${{ matrix.run_dir }}/result.json \
            --arg lang "${{ matrix.language }}" \
            '{language:$lang, benchmarks:$data[0].benchmarks}' > results/result.json
          cat results/result.json

      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: results/result.json
