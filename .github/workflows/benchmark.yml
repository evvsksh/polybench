name: Benchmark

on:
  push:

jobs:
  benchmark:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            install: pip install psutil
            run_dir: benchmarks/python
            run_cmd: python3 main.py
            artifact: benchmark-python

    steps:
      - uses: actions/checkout@v4

      - name: python setup
        if: matrix.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: install
        if: matrix.install != ''
        run: ${{ matrix.install }}

      - name: run benchmark
        run: |
          cd ${{ matrix.run_dir }}
          ${{ matrix.run_cmd }} > result.json

      - name: build result
        run: |
          mkdir -p results
          jq -n --argfile data ${{ matrix.run_dir }}/result.json \
            --arg lang "${{ matrix.language }}" \
            '{language:$lang, benchmarks:$data.benchmarks}' > results/result.json

      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: results/result.json
